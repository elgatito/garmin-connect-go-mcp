name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          mkdir -p dist/stage
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}; bin=garmin-mcp
            if [ "$os" = windows ]; then bin=garmin-mcp.exe; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/stage/$bin" ./cmd/garmin-mcp || exit 1
            cp README.md LICENSE dist/stage/
            if [ "$os" = windows ]; then
              (cd dist/stage && zip -j "../garmin-mcp_${GITHUB_REF_NAME}_${os}_${arch}.zip" "$bin" README.md LICENSE)
            else
              tar -C dist/stage -czf "dist/garmin-mcp_${GITHUB_REF_NAME}_${os}_${arch}.tar.gz" "$bin" README.md LICENSE
            fi
            rm "dist/stage/$bin"
          done
          cd dist && sha256sum *.tar.gz *.zip > checksums.txt
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/checksums.txt --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
