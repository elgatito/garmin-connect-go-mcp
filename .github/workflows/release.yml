name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build archives
        run: |
          set -euo pipefail
          for t in windows/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            rm -rf dist/stage && mkdir -p dist/stage
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/stage/garmin-mcp${ext}" ./cmd/garmin-mcp
            cp README.md LICENSE dist/stage/
            # versionless name: README links use releases/latest/download/<name>
            name="garmin-mcp_${os}_${arch}"
            if [ "$os" = windows ]; then
              zip -j "dist/${name}.zip" dist/stage/*
            else
              tar -C dist/stage -czf "dist/${name}.tar.gz" .
            fi
          done
          rm -rf dist/stage
          cd dist && sha256sum *.tar.gz *.zip > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/checksums.txt --generate-notes
